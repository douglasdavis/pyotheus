[package]
name = "pyotheus"
version = "0.0.1"
edition = "2024"

[lib]
name = "pyotheus"
crate-type = ["cdylib"]

[dependencies]
indexmap = "2.14"
prometheus-client = "0.26"
pyo3 = { version = "0.30", features = ["abi3-py312", "indexmap"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "std", "valuable"] }
